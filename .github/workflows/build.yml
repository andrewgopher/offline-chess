name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Test chess rules and match protocol
        run: swift test -c release

      - name: Build app bundle
        run: ./scripts/build-app.sh

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: OfflineChess-app
          path: dist/OfflineChess.zip
          retention-days: 30
